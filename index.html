<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 恋爱小屋 - 属于我们的甜蜜空间</title>
    <style>
        :root {
            --pink: #ff6b9d;
            --pink-light: #ff8fab;
            --pink-lighter: #ffe0ec;
            --pink-bg: #fff5f8;
            --white: #ffffff;
            --text: #4a3040;
            --text-light: #7a6070;
            --shadow: 0 4px 20px rgba(255, 107, 157, 0.15);
            --shadow-lg: 0 8px 40px rgba(255, 107, 157, 0.2);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --gold: #ffb347;
            --coral: #ff7f7f;
            --lavender: #c9a0dc;
            --mint: #7ec8a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #ffe0ec 0%, #fff0f5 25%, #fde2e9 50%, #fff5f8 75%, #ffe8f0 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }
        .bg-circle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatCircle 15s ease-in-out infinite;
        }
        .bg-circle:nth-child(1) {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 143, 171, 0.25) 0%, transparent 70%);
            top: -50px;
            left: -60px;
            animation-delay: 0s;
        }
        .bg-circle:nth-child(2) {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(201, 160, 220, 0.2) 0%, transparent 70%);
            bottom: -80px;
            right: -70px;
            animation-delay: -5s;
            animation-duration: 18s;
        }
        .bg-circle:nth-child(3) {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(255, 179, 71, 0.2) 0%, transparent 70%);
            top: 40%;
            left: 60%;
            animation-delay: -10s;
            animation-duration: 20s;
        }

        @keyframes floatCircle {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(30px, -40px) scale(1.1);
            }
            50% {
                transform: translate(-20px, 20px) scale(0.9);
            }
            75% {
                transform: translate(15px, 35px) scale(1.05);
            }
        }

        /* 主容器 */
        .app-container {
            width: 100%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.6);
            min-height: 85vh;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        /* 顶部标题栏 */
        .header {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 40%, #ff9bb5 100%);
            padding: 16px 20px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 40px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            filter: blur(15px);
        }
        .header .title {
            font-size: 1.4em;
            font-weight: 700;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .header .subtitle {
            font-size: 0.85em;
            opacity: 0.9;
            margin-top: 2px;
            position: relative;
            z-index: 1;
            font-weight: 400;
            letter-spacing: 2px;
        }
        .header .sparkle {
            position: absolute;
            pointer-events: none;
            animation: sparkleFloat 3s ease-in-out infinite;
            font-size: 1.2em;
        }
        @keyframes sparkleFloat {
            0%,
            100% {
                transform: translateY(0) scale(1);
                opacity: 0.7;
            }
            50% {
                transform: translateY(-15px) scale(1.3);
                opacity: 1;
            }
        }

        /* 内容区域 */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .content::-webkit-scrollbar {
            width: 4px;
        }
        .content::-webkit-scrollbar-track {
            background: transparent;
        }
        .content::-webkit-scrollbar-thumb {
            background: #ffccd5;
            border-radius: 10px;
        }

        /* 底部导航 */
        .bottom-nav {
            display: flex;
            background: rgba(255, 255, 255, 0.95);
            border-top: 1px solid #ffe0ec;
            padding: 6px 4px;
            padding-bottom: max(6px, env(safe-area-inset-bottom));
            gap: 2px;
            flex-shrink: 0;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 4px;
            cursor: pointer;
            border-radius: 14px;
            transition: var(--transition);
            color: #b8949e;
            font-size: 0.7em;
            font-weight: 500;
            gap: 4px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        .nav-item .nav-icon {
            font-size: 1.5em;
            transition: var(--transition);
        }
        .nav-item.active {
            color: #ff6b9d;
            background: #fff0f5;
            font-weight: 700;
        }
        .nav-item.active .nav-icon {
            transform: scale(1.15);
        }
        .nav-item:active {
            transform: scale(0.93);
            background: #fff5f8;
        }
        .nav-item.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 25px;
            height: 3px;
            background: #ff6b9d;
            border-radius: 0 0 5px 5px;
        }

        /* 通用卡片 */
        .card {
            background: white;
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid #fff0f5;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            font-weight: 700;
            font-size: 1.05em;
            color: var(--text);
        }
        .card-header .icon {
            font-size: 1.5em;
        }

        /* 按钮 */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: var(--transition);
            font-family: inherit;
            letter-spacing: 0.5px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff6b9d, #ff8fab);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.35);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.5);
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: scale(0.95);
        }
        .btn-outline {
            background: white;
            color: #ff6b9d;
            border: 2px solid #ffb3c9;
        }
        .btn-outline:hover {
            background: #fff5f8;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8em;
            border-radius: 20px;
        }
        .btn-danger {
            background: #fff0f0;
            color: #e05555;
            border: 1px solid #ffcccc;
        }
        .btn-danger:hover {
            background: #ffe0e0;
        }
        .btn-icon {
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            background: #fff5f8;
            border: 1px solid #ffe0ec;
            color: #ff6b9d;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-icon:hover {
            background: #ffe0ec;
        }

        /* 输入框 */
        .input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 25px;
            border: 2px solid #ffe0ec;
            font-size: 0.9em;
            outline: none;
            transition: var(--transition);
            background: #fffafc;
            font-family: inherit;
            color: var(--text);
        }
        .input:focus {
            border-color: #ff8fab;
            box-shadow: 0 0 0 4px rgba(255, 143, 171, 0.1);
            background: white;
        }
        .textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 20px;
            border: 2px solid #ffe0ec;
            font-size: 0.9em;
            outline: none;
            resize: vertical;
            min-height: 80px;
            transition: var(--transition);
            background: #fffafc;
            font-family: inherit;
            color: var(--text);
        }
        .textarea:focus {
            border-color: #ff8fab;
            box-shadow: 0 0 0 4px rgba(255, 143, 171, 0.1);
            background: white;
        }

        /* ========== 恋爱小屋 - 首页 ========== */
        .home-hero {
            text-align: center;
            padding: 10px 0;
        }
        .home-hero .house-emoji {
            font-size: 4em;
            animation: bounceHouse 2s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes bounceHouse {
            0%,
            100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-18px);
            }
            50% {
                transform: translateY(0);
            }
            70% {
                transform: translateY(-8px);
            }
        }
        .big-countdown {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #fff5f8, #ffe8f0);
            border-radius: var(--radius);
            margin: 14px 0;
            border: 2px dashed #ffccd5;
            position: relative;
        }
        .big-countdown .label {
            font-size: 0.9em;
            color: #b8949e;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .big-countdown .days {
            font-size: 3.5em;
            font-weight: 800;
            color: #ff6b9d;
            letter-spacing: 2px;
            text-shadow: 0 3px 10px rgba(255, 107, 157, 0.2);
        }
        .big-countdown .days-sub {
            font-size: 1em;
            color: #c97a8f;
            margin-top: 2px;
        }
        .home-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }
        .home-stat {
            background: white;
            border-radius: var(--radius-sm);
            padding: 14px;
            text-align: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid #fff0f5;
        }
        .home-stat:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }
        .home-stat .stat-icon {
            font-size: 2em;
            margin-bottom: 4px;
        }
        .home-stat .stat-num {
            font-size: 1.6em;
            font-weight: 700;
            color: #ff6b9d;
        }
        .home-stat .stat-label {
            font-size: 0.75em;
            color: #b8949e;
            margin-top: 2px;
        }

        /* ========== 倒计时页面 ========== */
        .countdown-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: white;
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border-left: 4px solid #ff8fab;
            transition: var(--transition);
            gap: 10px;
            flex-wrap: wrap;
        }
        .countdown-item:hover {
            box-shadow: var(--shadow);
        }
        .countdown-info {
            flex: 1;
            min-width: 120px;
        }
        .countdown-info .cd-title {
            font-weight: 700;
            color: var(--text);
            font-size: 0.95em;
        }
        .countdown-info .cd-date {
            font-size: 0.75em;
            color: #b8949e;
            margin-top: 2px;
        }
        .countdown-days {
            font-weight: 800;
            font-size: 1.3em;
            color: #ff6b9d;
            text-align: center;
            min-width: 60px;
        }
        .countdown-days.future {
            color: #c9a0dc;
        }
        .countdown-days .cd-sub {
            font-size: 0.5em;
            font-weight: 400;
            display: block;
            color: #b8949e;
        }

        /* ========== 任务打卡 ========== */
        .task-progress-bar {
            height: 8px;
            background: #ffe0ec;
            border-radius: 10px;
            margin: 10px 0 16px;
            overflow: hidden;
        }
        .task-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b9d, #ff8fab);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: white;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
            transition: var(--transition);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .task-item:hover {
            box-shadow: var(--shadow);
        }
        .task-check {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #ffb3c9;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
            font-size: 0.8em;
            color: transparent;
        }
        .task-item.done .task-check {
            background: #ff6b9d;
            border-color: #ff6b9d;
            color: white;
        }
        .task-item.done .task-title {
            text-decoration: line-through;
            color: #c9a0b8;
        }
        .task-title {
            flex: 1;
            font-weight: 500;
            color: var(--text);
            font-size: 0.9em;
        }
        .task-delete {
            opacity: 0;
            transition: var(--transition);
            cursor: pointer;
            font-size: 1.1em;
            color: #d99;
            padding: 4px 8px;
            border-radius: 50%;
        }
        .task-item:hover .task-delete {
            opacity: 1;
        }

        /* ========== 照片墙 ========== */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .photo-item {
            aspect-ratio: 1;
            border-radius: var(--radius-sm);
            overflow: hidden;
            cursor: pointer;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: var(--transition);
            background: #ffe0ec;
        }
        .photo-item:hover {
            transform: scale(1.03);
            box-shadow: var(--shadow-lg);
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-item .photo-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 0.7em;
            padding: 4px 8px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .photo-add {
            aspect-ratio: 1;
            border-radius: var(--radius-sm);
            border: 3px dashed #ffccd5;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 2.5em;
            color: #ffb3c9;
            background: #fffafc;
        }
        .photo-add:hover {
            border-color: #ff8fab;
            color: #ff8fab;
            background: #fff5f8;
        }
        .photo-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .photo-modal img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .photo-modal .close-hint {
            position: absolute;
            top: 20px;
            right: 25px;
            color: white;
            font-size: 2em;
            cursor: pointer;
            z-index: 101;
        }

        /* ========== 日记库 ========== */
        .diary-item {
            padding: 14px 16px;
            background: white;
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            border-left: 3px solid transparent;
        }
        .diary-item:hover {
            box-shadow: var(--shadow);
            border-left-color: #ff8fab;
        }
        .diary-item .diary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .diary-item .diary-date {
            font-size: 0.75em;
            color: #b8949e;
        }
        .diary-item .diary-mood {
            font-size: 1.3em;
        }
        .diary-item .diary-title {
            font-weight: 700;
            color: var(--text);
            font-size: 0.95em;
        }
        .diary-item .diary-preview {
            font-size: 0.8em;
            color: #b8949e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 4px;
        }
        .mood-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 8px 0;
        }
        .mood-option {
            font-size: 1.6em;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 20px;
            transition: var(--transition);
            border: 2px solid transparent;
            background: #fffafc;
        }
        .mood-option:hover {
            background: #fff0f5;
            border-color: #ffccd5;
        }
        .mood-option.selected {
            background: #fff0f5;
            border-color: #ff6b9d;
            transform: scale(1.1);
        }

        /* ========== 愿望清单 ========== */
        .wish-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: white;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
            transition: var(--transition);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .wish-item:hover {
            box-shadow: var(--shadow);
        }
        .wish-star {
            font-size: 1.5em;
            transition: var(--transition);
            flex-shrink: 0;
            cursor: pointer;
        }
        .wish-item.fulfilled .wish-star {
            filter: grayscale(0);
            animation: starPop 0.4s ease;
        }
        .wish-item.fulfilled .wish-title {
            text-decoration: line-through;
            color: #c9a0b8;
        }
        @keyframes starPop {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.5);
            }
        }
        .wish-title {
            flex: 1;
            font-weight: 500;
            color: var(--text);
            font-size: 0.9em;
        }
        .wish-date {
            font-size: 0.7em;
            color: #b8949e;
        }

        /* ========== 弹窗 ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 50;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .modal-sheet {
            background: white;
            border-radius: 24px 24px 0 0;
            padding: 20px;
            width: 100%;
            max-width: 460px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.35s ease;
        }
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        .modal-sheet h3 {
            text-align: center;
            margin-bottom: 16px;
            color: var(--text);
            font-size: 1.1em;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 1.4em;
            cursor: pointer;
            color: #b8949e;
            z-index: 5;
            padding: 8px;
        }

        /* 飘落心形 */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .floating-heart {
            position: absolute;
            animation: fallDown linear forwards;
            opacity: 0.7;
            pointer-events: none;
        }
        @keyframes fallDown {
            0% {
                transform: translateY(-60px) rotate(0deg) scale(1);
                opacity: 0.9;
            }
            60% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(0.3);
                opacity: 0;
            }
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            z-index: 200;
            font-size: 0.85em;
            animation: toastIn 0.4s ease, toastOut 0.4s ease 1.8s forwards;
            pointer-events: none;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .app-container {
                max-width: 100%;
                border-radius: 22px;
                min-height: 90vh;
                max-height: 98vh;
            }
            .photo-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
            .big-countdown .days {
                font-size: 2.8em;
            }
            .nav-item {
                font-size: 0.65em;
                padding: 6px 2px;
            }
            .nav-item .nav-icon {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>

    <!-- 背景装饰 -->
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>
    <div class="floating-hearts" id="floatingHearts"></div>

    <!-- 主容器 -->
    <div class="app-container" id="appContainer">
        <!-- 头部 -->
        <div class="header" id="headerBar">
            <div class="title" id="headerTitle">🏡 恋爱小屋</div>
            <div class="subtitle" id="headerSubtitle">属于我们的甜蜜空间</div>
        </div>

        <!-- 内容区 -->
        <div class="content" id="contentArea"></div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active" data-tab="home" onclick="switchTab('home')">
                <span class="nav-icon">🏠</span>小屋
            </div>
            <div class="nav-item" data-tab="countdown" onclick="switchTab('countdown')">
                <span class="nav-icon">⏰</span>倒计时
            </div>
            <div class="nav-item" data-tab="tasks" onclick="switchTab('tasks')">
                <span class="nav-icon">✅</span>打卡
            </div>
            <div class="nav-item" data-tab="photos" onclick="switchTab('photos')">
                <span class="nav-icon">📸</span>照片
            </div>
            <div class="nav-item" data-tab="diary" onclick="switchTab('diary')">
                <span class="nav-icon">📝</span>日记
            </div>
            <div class="nav-item" data-tab="wishes" onclick="switchTab('wishes')">
                <span class="nav-icon">💝</span>愿望
            </div>
        </div>
    </div>

    <!-- 照片查看弹窗 -->
    <div id="photoModal" class="photo-modal" style="display:none;" onclick="closePhotoModal()">
        <span class="close-hint">✕</span>
        <img id="photoModalImg" src="" alt="照片" />
    </div>

    <!-- 通用弹窗 -->
    <div id="modalOverlay" class="modal-overlay" style="display:none;" onclick="closeModal(event)">
        <div class="modal-sheet" id="modalSheet" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModalDirect()">✕</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        (function() {
            // ============ 数据管理 ============
            const STORAGE_KEY = 'love_cabin_data_v2';

            function getDefaultData() {
                const today = new Date();
                const y = today.getFullYear();
                return {
                    // 纪念日倒计时
                    countdowns: [
                        { id: 'cd1', title: '💕 我们在一起', date: `${y-1}-06-15`, type: 'love' },
                        { id: 'cd2', title: '🎂 TA的生日', date: `${y}-03-20`, type: 'birthday' },
                        { id: 'cd3', title: '💋 第一次约会', date: `${y-1}-07-01`, type: 'date' },
                        { id: 'cd4', title: '💍 下一个纪念日', date: `${y+1}-06-15`, type: 'future' },
                    ],
                    // 任务打卡 {id, title, completedDates: []}
                    tasks: [
                        { id: 't1', title: '🌅 说早安', completedDates: [] },
                        { id: 't2', title: '🌙 说晚安', completedDates: [] },
                        { id: 't3', title: '🤗 给对方一个拥抱', completedDates: [] },
                        { id: 't4', title: '📸 一起拍张合照', completedDates: [] },
                        { id: 't5', title: '🍳 一起做饭', completedDates: [] },
                        { id: 't6', title: '🚶 一起散步', completedDates: [] },
                    ],
                    // 照片 {id, data(base64), caption, date}
                    photos: [],
                    // 日记 {id, title, content, date, mood}
                    diaries: [],
                    // 愿望 {id, title, fulfilled, date}
                    wishes: [
                        { id: 'w1', title: '一起去看海 🌊', fulfilled: false, date: today.toISOString()
                                .split('T')[0] },
                        { id: 'w2', title: '一起看日出 🌅', fulfilled: false, date: today.toISOString()
                                .split('T')[0] },
                        { id: 'w3', title: '为TA做一顿烛光晚餐 🕯️', fulfilled: false, date: today.toISOString()
                                .split('T')[0] },
                        { id: 'w4', title: '一起养只小猫咪 🐱', fulfilled: false, date: today.toISOString()
                                .split('T')[0] },
                    ],
                    // 主要纪念日（恋爱小屋首页显示的）
                    mainAnniversary: 'cd1',
                };
            }

            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const data = JSON.parse(raw);
                        // 合并默认值，确保新字段存在
                        const defaults = getDefaultData();
                        for (const key of Object.keys(defaults)) {
                            if (!(key in data)) data[key] = defaults[key];
                        }
                        return data;
                    }
                } catch (e) {
                    console.warn('数据加载失败，使用默认数据');
                }
                return getDefaultData();
            }

            function saveData(data) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (e) {
                    showToast('⚠️ 存储空间不足，请清理一些照片或数据');
                    console.error('保存失败:', e);
                }
            }

            let appData = loadData();
            let currentTab = 'home';
            let selectedMood = '😊';

            function saveAll() {
                saveData(appData);
            }

            // ============ 工具函数 ============
            function genId() {
                return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            }

            function getTodayStr() {
                return new Date().toISOString().split('T')[0];
            }

            function formatDate(dateStr) {
                const d = new Date(dateStr);
                return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
            }

            function daysBetween(d1, d2) {
                const oneDay = 24 * 60 * 60 * 1000;
                return Math.round(Math.abs((d2 - d1) / oneDay));
            }

            function daysFromToday(targetDateStr) {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const target = new Date(targetDateStr);
                target.setHours(0, 0, 0, 0);
                const diff = target - today;
                return Math.ceil(diff / (24 * 60 * 60 * 1000));
            }

            function showToast(msg) {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2300);
            }

            // ============ 飘落心形 ============
            function spawnHeart() {
                const container = document.getElementById('floatingHearts');
                if (!container) return;
                const heart = document.createElement('span');
                heart.className = 'floating-heart';
                const emojis = ['💕', '💖', '💗', '💝', '✨', '🌸', '🩷', '💓', '🫧'];
                heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                heart.style.left = Math.random() * 95 + '%';
                heart.style.fontSize = (Math.random() * 18 + 12) + 'px';
                heart.style.animationDuration = (Math.random() * 8 + 6) + 's';
                heart.style.animationDelay = '0s';
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 15000);
            }
            setInterval(spawnHeart, 1800);
            for (let i = 0; i < 6; i++) setTimeout(spawnHeart, i * 400);

            // ============ 弹窗 ============
            function openModal(htmlContent) {
                document.getElementById('modalContent').innerHTML = htmlContent;
                document.getElementById('modalOverlay').style.display = 'flex';
            }

            function closeModal(event) {
                if (event.target === document.getElementById('modalOverlay')) {
                    document.getElementById('modalOverlay').style.display = 'none';
                }
            }

            function closeModalDirect() {
                document.getElementById('modalOverlay').style.display = 'none';
            }

            function closePhotoModal() {
                document.getElementById('photoModal').style.display = 'none';
            }

            function openPhotoModal(src) {
                document.getElementById('photoModalImg').src = src;
                document.getElementById('photoModal').style.display = 'flex';
            }

            // ============ 标签切换 ============
            function switchTab(tab) {
                currentTab = tab;
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                const navItem = document.querySelector(`.nav-item[data-tab="${tab}"]`);
                if (navItem) navItem.classList.add('active');

                const headerTitle = document.getElementById('headerTitle');
                const headerSubtitle = document.getElementById('headerSubtitle');
                const titles = {
                    home: ['🏡 恋爱小屋', '属于我们的甜蜜空间'],
                    countdown: ['⏰ 纪念日倒计时', '每个重要日子都值得铭记'],
                    tasks: ['✅ 任务打卡', '今天也要甜甜的哦~'],
                    photos: ['📸 照片墙', '定格我们的美好瞬间'],
                    diary: ['📝 日记库', '记录我们的点点滴滴'],
                    wishes: ['💝 愿望清单', '一起实现所有心愿'],
                };
                const [t, s] = titles[tab] || titles.home;
                headerTitle.textContent = t;
                headerSubtitle.textContent = s;

                renderContent();
                document.getElementById('contentArea').scrollTop = 0;
            }

            // ============ 渲染内容 ============
            function renderContent() {
                const area = document.getElementById('contentArea');
                switch (currentTab) {
                    case 'home':
                        area.innerHTML = renderHome();
                        break;
                    case 'countdown':
                        area.innerHTML = renderCountdown();
                        break;
                    case 'tasks':
                        area.innerHTML = renderTasks();
                        break;
                    case 'photos':
                        area.innerHTML = renderPhotos();
                        break;
                    case 'diary':
                        area.innerHTML = renderDiary();
                        break;
                    case 'wishes':
                        area.innerHTML = renderWishes();
                        break;
                    default:
                        area.innerHTML = renderHome();
                }
                // 重新绑定事件
                bindContentEvents();
            }

            // ============ 恋爱小屋首页 ============
            function renderHome() {
                const mainCd = appData.countdowns.find(c => c.id === appData.mainAnniversary) || appData.countdowns[
                    0];
                let daysText, daysSub, daysNum;
                if (mainCd) {
                    const diff = daysFromToday(mainCd.date);
                    daysNum = Math.abs(diff);
                    if (diff >= 0) {
                        daysText = daysNum;
                        daysSub = diff === 0 ? '就是今天！🎉' : '天后到来';
                    } else {
                        daysText = daysNum;
                        daysSub = '天前 · 已经在一起';
                    }
                } else {
                    daysText = '💕';
                    daysSub = '设置一个纪念日吧';
                    daysNum = 0;
                }

                const todayStr = getTodayStr();
                const todayTasksDone = appData.tasks.filter(t => t.completedDates.includes(todayStr)).length;
                const totalTasks = appData.tasks.length;
                const taskPercent = totalTasks > 0 ? Math.round((todayTasksDone / totalTasks) * 100) : 0;

                return `
                <div class="home-hero">
                    <span class="house-emoji">🏡</span>
                    <p style="color:#b8949e;margin-top:6px;font-size:0.9em;">欢迎回到我们的甜蜜小窝~</p>
                </div>
                <div class="big-countdown">
                    <div class="label">${mainCd ? mainCd.title : '💕 我们的纪念日'}</div>
                    <div class="days">${daysText}</div>
                    <div class="days-sub">${daysSub}</div>
                    ${mainCd ? `<div style="font-size:0.75em;color:#b8949e;margin-top:4px;">📅 ${formatDate(mainCd.date)}</div>` : ''}
                </div>
                <div class="home-stats">
                    <div class="home-stat" onclick="switchTab('tasks')">
                        <div class="stat-icon">✅</div>
                        <div class="stat-num">${todayTasksDone}/${totalTasks}</div>
                        <div class="stat-label">今日打卡</div>
                        <div style="font-size:0.7em;color:#ff8fab;">完成 ${taskPercent}%</div>
                    </div>
                    <div class="home-stat" onclick="switchTab('photos')">
                        <div class="stat-icon">📸</div>
                        <div class="stat-num">${appData.photos.length}</div>
                        <div class="stat-label">甜蜜照片</div>
                    </div>
                    <div class="home-stat" onclick="switchTab('diary')">
                        <div class="stat-icon">📝</div>
                        <div class="stat-num">${appData.diaries.length}</div>
                        <div class="stat-label">篇日记</div>
                    </div>
                    <div class="home-stat" onclick="switchTab('wishes')">
                        <div class="stat-icon">💝</div>
                        <div class="stat-num">${appData.wishes.filter(w=>w.fulfilled).length}/${appData.wishes.length}</div>
                        <div class="stat-label">愿望实现</div>
                    </div>
                </div>
                <div style="text-align:center;margin-top:16px;">
                    <button class="btn btn-primary" onclick="switchTab('countdown')">💕 查看所有纪念日</button>
                </div>
                <div style="text-align:center;margin-top:12px;color:#c9a0b8;font-size:0.8em;font-style:italic;">
                    "每一天都值得被纪念，每一刻都想和你分享"
                </div>
            `;
            }

            // ============ 倒计时页面 ============
            function renderCountdown() {
                let html = `
                <div class="card">
                    <div class="card-header"><span class="icon">⏰</span>纪念日倒计时</div>
                    <div id="countdownList">
            `;
                const sorted = [...appData.countdowns].sort((a, b) => {
                    const da = Math.abs(daysFromToday(a.date));
                    const db = Math.abs(daysFromToday(b.date));
                    // 未来的排前面（按接近程度），过去的排后面
                    const fa = daysFromToday(a.date);
                    const fb = daysFromToday(b.date);
                    if (fa >= 0 && fb < 0) return -1;
                    if (fa < 0 && fb >= 0) return 1;
                    return da - db;
                });
                sorted.forEach(cd => {
                    const diff = daysFromToday(cd.date);
                    const absDiff = Math.abs(diff);
                    let displayDays, subText, cssClass;
                    if (diff > 0) {
                        displayDays = absDiff;
                        subText = '天后';
                        cssClass = 'future';
                    } else if (diff === 0) {
                        displayDays = '🎉';
                        subText = '就是今天！';
                        cssClass = '';
                    } else {
                        displayDays = absDiff;
                        subText = '天前';
                        cssClass = '';
                    }
                    const isMain = cd.id === appData.mainAnniversary;
                    html += `
                    <div class="countdown-item">
                        <div class="countdown-info">
                            <div class="cd-title">${isMain ? '⭐ ' : ''}${cd.title}</div>
                            <div class="cd-date">📅 ${formatDate(cd.date)}</div>
                        </div>
                        <div class="countdown-days ${cssClass}">
                            ${displayDays}<span class="cd-sub">${subText}</span>
                        </div>
                        <div style="display:flex;gap:4px;flex-shrink:0;">
                            ${!isMain ? `<button class="btn-icon btn-sm" onclick="setMainCD('${cd.id}')" title="设为首页显示" style="font-size:0.7em;">⭐</button>` : ''}
                            <button class="btn-icon btn-sm" onclick="deleteCD('${cd.id}')" style="font-size:0.7em;color:#d99;">🗑️</button>
                        </div>
                    </div>
                `;
                });
                html += `</div>
                <button class="btn btn-primary" style="width:100%;margin-top:12px;" onclick="openAddCD()">＋ 添加纪念日</button>
                </div>`;
                return html;
            }

            function openAddCD() {
                openModal(`
                <h3>💕 添加纪念日</h3>
                <div style="display:flex;flex-direction:column;gap:12px;">
                    <input class="input" id="newCDTitle" placeholder="纪念日名称，如：第一次旅行✈️" />
                    <input class="input" type="date" id="newCDDate" value="${getTodayStr()}" />
                    <button class="btn btn-primary" onclick="addNewCD()">💝 添加</button>
                </div>
            `);
            }

            function addNewCD() {
                const title = document.getElementById('newCDTitle')?.value.trim();
                const date = document.getElementById('newCDDate')?.value;
                if (!title || !date) { showToast('请填写完整信息哦~'); return; }
                appData.countdowns.push({ id: genId(), title, date, type: 'custom' });
                if (!appData.mainAnniversary || appData.countdowns.length === 1) {
                    appData.mainAnniversary = appData.countdowns[appData.countdowns.length - 1].id;
                }
                saveAll();
                closeModalDirect();
                renderContent();
                showToast('纪念日添加成功！💕');
            }

            function setMainCD(id) {
                appData.mainAnniversary = id;
                saveAll();
                renderContent();
                showToast('已设为首页纪念日 ⭐');
            }

            function deleteCD(id) {
                if (appData.countdowns.length <= 1) { showToast('至少保留一个纪念日哦~'); return; }
                if (!confirm('确定要删除这个纪念日吗？')) return;
                appData.countdowns = appData.countdowns.filter(c => c.id !== id);
                if (appData.mainAnniversary === id) {
                    appData.mainAnniversary = appData.countdowns[0]?.id || null;
                }
                saveAll();
                renderContent();
                showToast('已删除');
            }

            // ============ 任务打卡 ============
            function renderTasks() {
                const todayStr = getTodayStr();
                const doneCount = appData.tasks.filter(t => t.completedDates.includes(todayStr)).length;
                const total = appData.tasks.length;
                const percent = total > 0 ? Math.round((doneCount / total) * 100) : 0;
                let html = `
                <div class="card">
                    <div class="card-header"><span class="icon">✅</span>今日任务打卡</div>
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <span style="font-weight:700;color:#ff6b9d;">完成 ${doneCount}/${total}</span>
                        <span style="font-size:0.8em;color:#b8949e;">📅 ${todayStr}</span>
                    </div>
                    <div class="task-progress-bar">
                        <div class="task-progress-fill" style="width:${percent}%;"></div>
                    </div>
                    <div id="taskList">
            `;
                appData.tasks.forEach(task => {
                    const isDone = task.completedDates.includes(todayStr);
                    html += `
                    <div class="task-item ${isDone ? 'done' : ''}" onclick="toggleTask('${task.id}')">
                        <div class="task-check">✓</div>
                        <span class="task-title">${task.title}</span>
                        <span class="task-delete" onclick="event.stopPropagation();deleteTask('${task.id}')">×</span>
                    </div>
                `;
                });
                html += `</div>
                <button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="resetAllTasks()">🔄 重置今日打卡</button>
                <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="openAddTask()">＋ 添加任务</button>
                </div>`;
                return html;
            }

            function toggleTask(id) {
                const todayStr = getTodayStr();
                const task = appData.tasks.find(t => t.id === id);
                if (!task) return;
                if (task.completedDates.includes(todayStr)) {
                    task.completedDates = task.completedDates.filter(d => d !== todayStr);
                } else {
                    task.completedDates.push(todayStr);
                }
                saveAll();
                renderContent();
                if (task.completedDates.includes(todayStr)) {
                    showToast('太棒了！完成打卡 ✅');
                }
            }

            function deleteTask(id) {
                if (appData.tasks.length <= 1) { showToast('至少保留一个任务哦~'); return; }
                appData.tasks = appData.tasks.filter(t => t.id !== id);
                saveAll();
                renderContent();
                showToast('任务已删除');
            }

            function resetAllTasks() {
                if (!confirm('确定要重置所有今日打卡吗？')) return;
                const todayStr = getTodayStr();
                appData.tasks.forEach(t => {
                    t.completedDates = t.completedDates.filter(d => d !== todayStr);
                });
                saveAll();
                renderContent();
                showToast('已重置 🔄');
            }

            function openAddTask() {
                openModal(`
                <h3>✅ 添加打卡任务</h3>
                <div style="display:flex;flex-direction:column;gap:12px;">
                    <input class="input" id="newTaskTitle" placeholder="任务名称，如：一起看电影🎬" />
                    <button class="btn btn-primary" onclick="addNewTask()">添加任务</button>
                </div>
            `);
            }

            function addNewTask() {
                const title = document.getElementById('newTaskTitle')?.value.trim();
                if (!title) { showToast('请输入任务名称~'); return; }
                appData.tasks.push({ id: genId(), title, completedDates: [] });
                saveAll();
                closeModalDirect();
                renderContent();
                showToast('任务添加成功！');
            }

            // ============ 照片墙 ============
            function renderPhotos() {
                let html = `
                <div class="card">
                    <div class="card-header"><span class="icon">📸</span>我们的照片墙</div>
                    <div class="photo-grid" id="photoGrid">
            `;
                appData.photos.forEach(photo => {
                    html += `
                    <div class="photo-item" onclick="openPhotoModal('${photo.data.replace(/'/g, "\\'")}')">
                        <img src="${photo.data}" alt="${photo.caption || '照片'}" loading="lazy" />
                        ${photo.caption ? `<div class="photo-caption">${photo.caption}</div>` : ''}
                        <div style="position:absolute;top:4px;right:4px;font-size:0.7em;background:rgba(0,0,0,0.5);color:white;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;" onclick="event.stopPropagation();deletePhoto('${photo.id}')">×</div>
                    </div>
                `;
                });
                html += `
                    <label class="photo-add" for="photoInput" title="上传照片">
                        ＋
                        <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="handlePhotoUpload(event)" />
                    </label>
                </div>
                <p style="text-align:center;color:#b8949e;font-size:0.7em;margin-top:8px;">点击 ＋ 上传甜蜜照片~ 点击照片查看大图</p>
                </div>`;
                return html;
            }

            function handlePhotoUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) { showToast('请选择图片文件~'); return; }
                if (file.size > 10 * 1024 * 1024) { showToast('图片太大啦，请选择10MB以下的图片~'); return; }

                const reader = new FileReader();
                reader.onload = function(e) {
                    // 压缩图片
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let w = img.width;
                        let h = img.height;
                        const maxW = 600;
                        if (w > maxW) {
                            h = Math.round(h * (maxW / w));
                            w = maxW;
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const compressedData = canvas.toDataURL('image/jpeg', 0.55);
                        const caption = prompt('给这张照片写个描述吧~（可选）') || '';
                        appData.photos.push({
                            id: genId(),
                            data: compressedData,
                            caption,
                            date: getTodayStr(),
                        });
                        saveAll();
                        renderContent();
                        showToast('照片上传成功！📸');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
                event.target.value = '';
            }

            function deletePhoto(id) {
                if (!confirm('确定要删除这张照片吗？')) return;
                appData.photos = appData.photos.filter(p => p.id !== id);
                saveAll();
                renderContent();
                showToast('照片已删除');
            }

            // ============ 日记库 ============
            function renderDiary() {
                let html = `
                <div class="card">
                    <div class="card-header"><span class="icon">📝</span>我们的日记</div>
                    <button class="btn btn-primary" style="width:100%;margin-bottom:12px;" onclick="openWriteDiary()">✍️ 写新日记</button>
                    <div id="diaryList">
            `;
                const sorted = [...appData.diaries].sort((a, b) => b.date.localeCompare(a.date));
                if (sorted.length === 0) {
                    html += `<p style="text-align:center;color:#b8949e;padding:20px;">还没有日记呢~<br>写下你们的甜蜜故事吧 💕</p>`;
                }
                sorted.forEach(d => {
                    const preview = d.content.replace(/<[^>]*>/g, '').substring(0, 60);
                    html += `
                    <div class="diary-item" onclick="viewDiary('${d.id}')">
                        <div class="diary-header">
                            <span class="diary-date">📅 ${d.date}</span>
                            <span class="diary-mood">${d.mood || '😊'}</span>
                        </div>
                        <div class="diary-title">${d.title}</div>
                        <div class="diary-preview">${preview}${d.content.length > 60 ? '...' : ''}</div>
                        <button class="btn-icon btn-sm" style="position:absolute;top:8px;right:8px;font-size:0.65em;" onclick="event.stopPropagation();deleteDiary('${d.id}')">🗑️</button>
                    </div>
                `;
                });
                html += `</div></div>`;
                return html;
            }

            function openWriteDiary(editId = null) {
                let diary = null;
                if (editId) {
                    diary = appData.diaries.find(d => d.id === editId);
                }
                selectedMood = diary?.mood || '😊';
                const moods = ['😊', '🥰', '😆', '🥺', '💭', '😤', '😢', '🤩', '😴', '🥳'];
                const moodHTML = moods.map(m =>
                    `<span class="mood-option ${selectedMood === m ? 'selected' : ''}" onclick="selectMood('${m}')">${m}</span>`
                ).join('');
                openModal(`
                <h3>${editId ? '✏️ 编辑日记' : '✍️ 写新日记'}</h3>
                <div style="display:flex;flex-direction:column;gap:10px;">
                    <input class="input" id="diaryTitle" placeholder="日记标题" value="${diary?.title || ''}" />
                    <div class="mood-selector" id="moodSelector">${moodHTML}</div>
                    <textarea class="textarea" id="diaryContent" placeholder="今天发生了什么甜蜜的事呢...">${diary?.content || ''}</textarea>
                    <input type="hidden" id="diaryEditId" value="${editId || ''}" />
                    <button class="btn btn-primary" onclick="saveDiary()">💾 保存日记</button>
                    ${editId ? '<button class="btn btn-outline btn-sm" style="width:100%;" onclick="closeModalDirect()">取消</button>' : ''}
                </div>
            `);
            }

            function selectMood(mood) {
                selectedMood = mood;
                document.querySelectorAll('.mood-option').forEach(el => el.classList.remove('selected'));
                const moodEl = document.querySelector(`.mood-option`);
                document.querySelectorAll('.mood-option').forEach(el => {
                    if (el.textContent === mood) el.classList.add('selected');
                });
            }

            function saveDiary() {
                const title = document.getElementById('diaryTitle')?.value.trim();
                const content = document.getElementById('diaryContent')?.value.trim();
                const editId = document.getElementById('diaryEditId')?.value;
                if (!title || !content) { showToast('请填写标题和内容哦~'); return; }
                if (editId) {
                    const diary = appData.diaries.find(d => d.id === editId);
                    if (diary) {
                        diary.title = title;
                        diary.content = content;
                        diary.mood = selectedMood;
                    }
                } else {
                    appData.diaries.push({
                        id: genId(),
                        title,
                        content,
                        date: getTodayStr(),
                        mood: selectedMood,
                    });
                }
                saveAll();
                closeModalDirect();
                renderContent();
                showToast(editId ? '日记已更新！' : '日记保存成功！📝');
            }

            function viewDiary(id) {
                const diary = appData.diaries.find(d => d.id === id);
                if (!diary) return;
                openModal(`
                <h3>${diary.mood || '😊'} ${diary.title}</h3>
                <p style="color:#b8949e;font-size:0.8em;">📅 ${diary.date}</p>
                <div style="margin-top:12px;line-height:1.7;white-space:pre-wrap;color:#4a3040;">${diary.content}</div>
                <div style="margin-top:16px;display:flex;gap:8px;">
                    <button class="btn btn-outline btn-sm" onclick="closeModalDirect();openWriteDiary('${diary.id}')">✏️ 编辑</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteDiary('${diary.id}');closeModalDirect();">🗑️ 删除</button>
                    <button class="btn btn-sm" style="background:#eee;" onclick="closeModalDirect()">关闭</button>
                </div>
            `);
            }

            function deleteDiary(id) {
                if (!confirm('确定要删除这篇日记吗？')) return;
                appData.diaries = appData.diaries.filter(d => d.id !== id);
                saveAll();
                renderContent();
                showToast('日记已删除');
            }

            // ============ 愿望清单 ============
            function renderWishes() {
                const unfulfilled = appData.wishes.filter(w => !w.fulfilled);
                const fulfilled = appData.wishes.filter(w => w.fulfilled);
                let html = `
                <div class="card">
                    <div class="card-header"><span class="icon">💝</span>愿望清单</div>
                    <div style="display:flex;gap:8px;margin-bottom:8px;">
                        <span style="font-weight:600;color:#ff6b9d;">✨ 未实现: ${unfulfilled.length}</span>
                        <span style="font-weight:600;color:#c9a0dc;">✅ 已实现: ${fulfilled.length}</span>
                    </div>
                    <div id="wishList">
            `;
                [...unfulfilled, ...fulfilled].forEach(w => {
                    html += `
                    <div class="wish-item ${w.fulfilled ? 'fulfilled' : ''}" onclick="toggleWish('${w.id}')">
                        <span class="wish-star">${w.fulfilled ? '🌟' : '⭐'}</span>
                        <span class="wish-title">${w.title}</span>
                        <span class="wish-date">${w.date}</span>
                        <button class="btn-icon btn-sm" style="font-size:0.65em;" onclick="event.stopPropagation();deleteWish('${w.id}')">×</button>
                    </div>
                `;
                });
                html += `</div>
                <button class="btn btn-primary" style="width:100%;margin-top:10px;" onclick="openAddWish()">＋ 添加愿望</button>
                </div>`;
                return html;
            }

            function toggleWish(id) {
                const wish = appData.wishes.find(w => w.id === id);
                if (!wish) return;
                wish.fulfilled = !wish.fulfilled;
                if (wish.fulfilled) {
                    wish.date = getTodayStr();
                    showToast('愿望实现啦！太棒了 🌟');
                }
                saveAll();
                renderContent();
            }

            function deleteWish(id) {
                appData.wishes = appData.wishes.filter(w => w.id !== id);
                saveAll();
                renderContent();
                showToast('愿望已删除');
            }

            function openAddWish() {
                openModal(`
                <h3>💝 添加愿望</h3>
                <div style="display:flex;flex-direction:column;gap:12px;">
                    <input class="input" id="newWishTitle" placeholder="愿望内容，如：一起去日本看樱花🌸" />
                    <button class="btn btn-primary" onclick="addNewWish()">✨ 添加到愿望清单</button>
                </div>
            `);
            }

            function addNewWish() {
                const title = document.getElementById('newWishTitle')?.value.trim();
                if (!title) { showToast('请输入愿望内容~'); return; }
                appData.wishes.push({ id: genId(), title, fulfilled: false, date: getTodayStr() });
                saveAll();
                closeModalDirect();
                renderContent();
                showToast('愿望已添加！💝');
            }

            // ============ 绑定事件 ============
            function bindContentEvents() {
                // 照片上传input
                const photoInput = document.getElementById('photoInput');
                if (photoInput) {
                    photoInput.addEventListener('change', handlePhotoUpload);
                }
            }

            // ============ 全局函数暴露 ============
            window.switchTab = switchTab;
            window.openAddCD = openAddCD;
            window.addNewCD = addNewCD;
            window.setMainCD = setMainCD;
            window.deleteCD = deleteCD;
            window.toggleTask = toggleTask;
            window.deleteTask = deleteTask;
            window.resetAllTasks = resetAllTasks;
            window.openAddTask = openAddTask;
            window.addNewTask = addNewTask;
            window.handlePhotoUpload = handlePhotoUpload;
            window.deletePhoto = deletePhoto;
            window.openPhotoModal = openPhotoModal;
            window.closePhotoModal = closePhotoModal;
            window.openWriteDiary = openWriteDiary;
            window.saveDiary = saveDiary;
            window.viewDiary = viewDiary;
            window.deleteDiary = deleteDiary;
            window.selectMood = selectMood;
            window.toggleWish = toggleWish;
            window.deleteWish = deleteWish;
            window.openAddWish = openAddWish;
            window.addNewWish = addNewWish;
            window.closeModal = closeModal;
            window.closeModalDirect = closeModalDirect;

            // ============ 初始化 ============
            function init() {
                renderContent();
                // 每天自动检测并清理过期的打卡数据（保留最近30天）
                const todayStr = getTodayStr();
                const thirtyDaysAgo = new Date();
                thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
                const cutoffStr = thirtyDaysAgo.toISOString().split('T')[0];
                let cleaned = false;
                appData.tasks.forEach(t => {
                    const oldLen = t.completedDates.length;
                    t.completedDates = t.completedDates.filter(d => d >= cutoffStr);
                    if (t.completedDates.length < oldLen) cleaned = true;
                });
                if (cleaned) saveAll();
            }

            init();
            console.log('💕 恋爱小屋已就绪！');
            console.log('🏡 所有数据存储在浏览器本地，请勿清除浏览器数据哦~');
            console.log('📸 照片存储在localStorage中，请注意存储空间限制（约5-10MB）');
        })();
    </script>
</body>
